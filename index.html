<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Fireworks Show</title>
<style>
  html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #05060f; }
  canvas { display: block; width: 100vw; height: 100vh; touch-action: none; cursor: crosshair; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(() => {
  const canvas = document.getElementById('c');
  const ctx = canvas.getContext('2d');
  let W = 0, H = 0, dpr = 1, stars = [];
  const rockets = [], particles = [];
  const GRAVITY = 0.06;

  function resize() {
    dpr = Math.min(window.devicePixelRatio || 1, 2);
    W = window.innerWidth; H = window.innerHeight;
    canvas.width = W * dpr; canvas.height = H * dpr;
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    const count = Math.round((W * H) / 4000);
    stars = Array.from({ length: count }, () => ({
      x: Math.random() * W, y: Math.random() * H * 0.9,
      r: Math.random() * 1.2 + 0.3,
      phase: Math.random() * Math.PI * 2, speed: Math.random() * 0.03 + 0.01
    }));
    ctx.fillStyle = '#05060f'; ctx.fillRect(0, 0, W, H);
  }
  window.addEventListener('resize', resize);
  resize();

  const rand = (a, b) => a + Math.random() * (b - a);

  function launch(tx, ty) {
    const x = rand(W * 0.2, W * 0.8);
    const targetX = tx ?? rand(W * 0.15, W * 0.85);
    const targetY = ty ?? rand(H * 0.12, H * 0.45);
    const frames = rand(45, 65);
    rockets.push({
      x, y: H, tx: targetX, ty: targetY,
      vx: (targetX - x) / frames, vy: (targetY - H) / frames,
      hue: Math.floor(rand(0, 360)), trail: []
    });
  }

  function burst(x, y, hue) {
    const n = Math.floor(rand(70, 120));
    const multi = Math.random() < 0.3;
    const power = rand(2.5, 4.5);
    for (let i = 0; i < n; i++) {
      const a = (Math.PI * 2 * i) / n + rand(-0.05, 0.05);
      const s = power * (0.4 + Math.random() * 0.6);
      particles.push({
        x, y, px: x, py: y,
        vx: Math.cos(a) * s, vy: Math.sin(a) * s,
        hue: multi ? Math.floor(rand(0, 360)) : hue + rand(-20, 20),
        life: 1, decay: rand(0.008, 0.016), size: rand(1.2, 2.4)
      });
    }
  }

  function drawStars(t) {
    for (const s of stars) {
      const a = 0.35 + 0.65 * (0.5 + 0.5 * Math.sin(s.phase + t * s.speed));
      ctx.fillStyle = `rgba(255,255,240,${a.toFixed(3)})`;
      ctx.beginPath(); ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2); ctx.fill();
    }
  }

  let frame = 0;
  function loop() {
    frame++;
    // translucent overlay leaves fading trails
    ctx.globalCompositeOperation = 'source-over';
    ctx.fillStyle = 'rgba(5, 6, 15, 0.22)';
    ctx.fillRect(0, 0, W, H);
    drawStars(frame);

    ctx.globalCompositeOperation = 'lighter';
    for (let i = rockets.length - 1; i >= 0; i--) {
      const r = rockets[i];
      r.trail.push({ x: r.x, y: r.y });
      if (r.trail.length > 8) r.trail.shift();
      r.x += r.vx; r.y += r.vy;
      ctx.strokeStyle = `hsla(${r.hue}, 100%, 75%, 0.9)`;
      ctx.lineWidth = 2;
      ctx.beginPath(); ctx.moveTo(r.trail[0].x, r.trail[0].y); ctx.lineTo(r.x, r.y); ctx.stroke();
      if (r.y <= r.ty) { burst(r.x, r.y, r.hue); rockets.splice(i, 1); }
    }

    for (let i = particles.length - 1; i >= 0; i--) {
      const p = particles[i];
      p.px = p.x; p.py = p.y;
      p.vx *= 0.985; p.vy = p.vy * 0.985 + GRAVITY;
      p.x += p.vx; p.y += p.vy;
      p.life -= p.decay;
      if (p.life <= 0 || p.y > H + 20) { particles.splice(i, 1); continue; }
      ctx.strokeStyle = `hsla(${p.hue}, 100%, ${50 + p.life * 20}%, ${p.life.toFixed(3)})`;
      ctx.lineWidth = p.size;
      ctx.beginPath(); ctx.moveTo(p.px, p.py); ctx.lineTo(p.x, p.y); ctx.stroke();
    }
    requestAnimationFrame(loop);
  }

  canvas.addEventListener('pointerdown', e => launch(e.clientX, e.clientY));
  setInterval(() => { if (!document.hidden) launch(); }, 1500);

  launch(); loop();
})();
</script>
</body>
</html>
